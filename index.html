<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Result Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Student Result Management System</h2>

  <!-- Search -->
  <input type="text" id="searchRoll" placeholder="Search by Roll No" onkeyup="searchStudent()">

  <!-- Form -->
  <form id="studentForm">
    <input type="text" id="roll" placeholder="Roll Number" required>
    <input type="text" id="name" placeholder="Student Name" required>

    <input type="number" id="s1" placeholder="Subject 1" required>
    <input type="number" id="s2" placeholder="Subject 2" required>
    <input type="number" id="s3" placeholder="Subject 3" required>
    <input type="number" id="s4" placeholder="Subject 4" required>
    <input type="number" id="s5" placeholder="Subject 5" required>
    <input type="number" id="s6" placeholder="Subject 6" required>
    <input type="number" id="s7" placeholder="Subject 7" required>

    <button type="submit">Add / Update Student</button>
  </form>

  <!-- Table -->
  <table>
    <thead>
      <tr>
        <th>Roll</th>
        <th>Name</th>
        <th>Total</th>
        <th>Percentage</th>
        <th>Result</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="studentTable"></tbody>
  </table>
</div>

<script src="script.js"></script>
</body>
</html>
